<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BET VIP HUB - Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080c11;
  color:white;
  padding-bottom:30px;
}

header{
  background:#111820;
  padding:18px;
  border-bottom:1px solid #26313b;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#20df72;
}

.container{
  padding:18px;
  max-width:700px;
  margin:auto;
}

h1{
  margin:10px 0 5px;
}

.subtitle{
  color:#89959f;
  font-size:13px;
  margin-bottom:22px;
}

.card{
  background:#111820;
  border:1px solid #26313b;
  border-radius:15px;
  padding:18px;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  color:#aeb8c0;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-bottom:15px;
  background:#0a1016;
  border:1px solid #2a3540;
  border-radius:9px;
  color:white;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#20df72;
}

.button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#20df72;
  color:#061009;
  font-weight:bold;
  cursor:pointer;
}

.secondary{
  background:#252f38;
  color:white;
  margin-top:10px;
}

.ticket{
  background:#0c1218;
  border:1px solid #29343e;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
}

.ticket h3{
  margin-bottom:8px;
}

.ticket p{
  color:#a2adb6;
  font-size:13px;
  line-height:1.6;
}

.price{
  color:#20df72;
  font-weight:bold;
  margin-top:8px;
}

.delete{
  background:#b83232;
  color:white;
  padding:9px 12px;
  border:0;
  border-radius:7px;
  margin-top:12px;
  cursor:pointer;
}

.success{
  display:none;
  background:#123c28;
  border:1px solid #216c42;
  color:#20df72;
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    BET <span>VIP HUB</span> — ADMIN
  </div>
</header>

<div class="container">

  <h1>Admin Panel</h1>

  <p class="subtitle">
    Tengeneza na simamia VIP tickets zako.
  </p>

  <div id="success" class="success">
    ✅ Ticket imehifadhiwa kikamilifu.
  </div>

  <div class="card">

    <h2 style="margin-bottom:18px;">
      Add VIP Ticket
    </h2>

    <label>Ticket Name</label>

    <input
      id="ticketName"
      type="text"
      placeholder="Mfano: VIP Ticket #003"
    >

    <label>Date</label>

    <input
      id="ticketDate"
      type="date"
    >

    <label>Price (TSh)</label>

    <input
      id="ticketPrice"
      type="number"
      placeholder="5000"
    >

    <label>Total Odds</label>

    <input
      id="ticketOdds"
      type="text"
      placeholder="12.50"
    >

    <label>Matches / Picks</label>

    <textarea
      id="ticketPicks"
      placeholder="Mfano:

Arsenal vs Chelsea — Over 1.5
Barcelona vs Sevilla — Home Win
Inter vs Roma — Over 2.5"
    ></textarea>

    <label>Status</label>

    <select id="ticketStatus">
      <option value="locked">Locked</option>
      <option value="open">Open</option>
    </select>

    <button class="button" onclick="addTicket()">
      + PUBLISH VIP TICKET
    </button>

  </div>


  <div class="card">

    <h2>Published Tickets</h2>

    <div id="tickets"></div>

  </div>

</div>


<script>

function getTickets(){

  return JSON.parse(
    localStorage.getItem("vipTickets") || "[]"
  );

}


function saveTickets(tickets){

  localStorage.setItem(
    "vipTickets",
    JSON.stringify(tickets)
  );

}


function addTicket(){

  const name =
    document.getElementById("ticketName").value.trim();

  const date =
    document.getElementById("ticketDate").value;

  const price =
    document.getElementById("ticketPrice").value;

  const odds =
    document.getElementById("ticketOdds").value.trim();

  const picks =
    document.getElementById("ticketPicks").value.trim();

  const status =
    document.getElementById("ticketStatus").value;


  if(!name || !date || !price || !odds || !picks){

    alert("Tafadhali jaza sehemu zote.");

    return;

  }


  const ticket = {

    id: Date.now(),

    name: name,

    date: date,

    price: price,

    odds: odds,

    picks: picks,

    status: status

  };


  const tickets = getTickets();

  tickets.unshift(ticket);

  saveTickets(tickets);


  document.getElementById("ticketName").value = "";

  document.getElementById("ticketDate").value = "";

  document.getElementById("ticketPrice").value = "";

  document.getElementById("ticketOdds").value = "";

  document.getElementById("ticketPicks").value = "";

  document.getElementById("ticketStatus").value = "locked";


  document.getElementById("success").style.display = "block";


  setTimeout(function(){

    document.getElementById("success").style.display = "none";

  },3000);


  showTickets();

}


function deleteTicket(id){

  if(!confirm("Una uhakika unataka kufuta ticket hii?")){

    return;

  }


  let tickets = getTickets();

  tickets = tickets.filter(function(ticket){

    return ticket.id !== id;

  });


  saveTickets(tickets);

  showTickets();

}


function showTickets(){

  const container =
    document.getElementById("tickets");

  const tickets = getTickets();


  if(tickets.length === 0){

    container.innerHTML =
      '<p style="color:#89959f;margin-top:15px;">Hakuna ticket bado.</p>';

    return;

  }


  container.innerHTML = "";


  tickets.forEach(function(ticket){

    const div =
      document.createElement("div");

    div.className = "ticket";


    div.innerHTML = `

      <h3>${escapeHTML(ticket.name)}</h3>

      <p>
        📅 ${escapeHTML(ticket.date)}<br>
        📊 Odds: ${escapeHTML(ticket.odds)}<br>
        🔒 Status: ${escapeHTML(ticket.status)}
      </p>

      <div class="price">
        TSh ${Number(ticket.price).toLocaleString()}
      </div>

      <button
        class="delete"
        onclick="deleteTicket(${ticket.id})"
      >
        Delete
      </button>

    `;


    container.appendChild(div);

  });

}


function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


showTickets();

</script>

</body>
</html>
